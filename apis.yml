aid: haseel
name: Haseel
description: >-
  Haseel (حصيل) is a Riyadh-based technology startup, founded in 2018, that
  delivers fresh fruits and vegetables to consumers across Saudi Arabia through
  its iOS and Android mobile apps. The company sources high-quality produce and
  fulfills each order from the nearest of its branches inside Riyadh, pairing a
  curated selection with fast, reliable last-mile delivery. Haseel reports more
  than 400,000 app downloads, three branches inside Riyadh, and over 1,000
  orders per day, and is backed by 500 Global. This profile is maintained in the
  API Evangelist network; Haseel is a consumer produce-delivery app and does not
  currently publish a public developer API or OpenAPI surface.
